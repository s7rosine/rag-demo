services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CHROMA_PATH: /app/storage/chroma
      OLLAMA_URL: http://ollama:11434
      HF_HOME: /app/storage/hf
    volumes:
      - rag_storage:/app/storage
    depends_on: [ollama]
  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on: [api]
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
volumes:
  rag_storage:
  ollama_data:
