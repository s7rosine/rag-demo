[project]
name = "rag-demo-platform"
version = "0.2.1"
description = "Authenticated RAG platform foundation for Vercel"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.12,<1",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "platform_app:app"
