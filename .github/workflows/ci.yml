name: RAG demo CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cloud-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check platform_core.py platform_app.py telegram_registration.py rag.py cloud_models.py cloud_sources.py sync_knowledge.py notion_sync.py rag_diagnostics.py tests/test_platform_core.py tests/test_platform_security.py tests/test_rag.py tests/test_telegram_rag.py tests/test_telegram_registration.py tests/test_cloud_adapters.py tests/test_notion_sync.py tests/test_rag_diagnostics.py
      - run: pytest -q tests/test_platform_core.py tests/test_platform_security.py tests/test_rag.py tests/test_telegram_rag.py tests/test_telegram_registration.py tests/test_cloud_adapters.py tests/test_notion_sync.py tests/test_rag_diagnostics.py
  local-rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src api.py app.py tests
      - run: pytest -q tests
      - run: docker build -t rag-demo:ci .
